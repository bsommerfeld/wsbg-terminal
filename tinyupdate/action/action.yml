# =============================================================================
#  TinyUpdate Package
#
#  Turns a build's artifacts into the release assets a TinyUpdateClient reads:
#  a manifest listing every file with its SHA-256 and size, the full archive,
#  and that archive split into an app half (changes every release) and a deps
#  half (rarely changes), so a typical update downloads only the small half.
#
#  Package layout (paths relative to the install directory):
#    lib/     the JARs from artifact-dirs, plus whatever extra-dir puts there
#    bin/     the scripts from script-dir
#    images/  the PNGs from images-dir
#
#  Asset naming - MUST match ReleaseAssetNames in the Java client: the
#  non-empty parts of asset-prefix, platform and the base name joined by "-".
#  The app archive never carries the platform (its files are the same
#  everywhere), so every platform run of one release writes an identical
#  <prefix>-app.zip.
#
#    asset-prefix  platform          manifest                          archives
#    ""            ""                update.json                       files.zip, app.zip, deps.zip
#    wsbg          windows-x86_64    wsbg-windows-x86_64-update.json   wsbg-windows-x86_64-files.zip,
#                                                                      wsbg-app.zip, wsbg-windows-x86_64-deps.zip
#
#  How the steps talk to each other: each step is its own bash process, so
#  what later steps need (paths, asset names) goes through $GITHUB_ENV under
#  a TINYUPDATE_ prefix - that file outlives the action for the rest of the
#  job, and the prefix keeps it clear of the caller's own variables. Inputs
#  reach the scripts as env variables, never spliced into the script text.
#
#  Requires bash 4 (associative arrays in step 2): the GitHub runners have
#  bash 5; macOS ships 3.2.
# =============================================================================

name: 'TinyUpdate Package'
description: 'Packages application artifacts with a SHA-256 manifest for TinyUpdate, optionally per platform'

inputs:
  artifact-dirs:
    description: 'Comma-separated list of directories containing JARs to package into lib/ (e.g. "app/target,app/target/deps")'
    required: true
  script-dir:
    description: 'Directory containing scripts to bundle into bin/'
    required: false
    default: '.script'
  scripts:
    description: 'Space-separated glob patterns (relative to script-dir) of the scripts to bundle'
    required: false
    default: 'setup.*'
  output-dir:
    description: 'Output directory for the manifest and the archives'
    required: false
    default: 'updater-dist'
  images-dir:
    description: 'Optional directory whose PNG images are bundled into images/'
    required: false
    default: ''
  extra-dir:
    description: 'Optional directory whose whole tree is copied verbatim into the package root (e.g. native libraries under lib/)'
    required: false
    default: ''
  asset-prefix:
    description: 'Prefix that sets this application''s assets apart from others in the same release'
    required: false
    default: ''
  platform:
    description: 'Platform this package serves (Platform.current() in the client, e.g. "macos-aarch64"); empty for a platform-neutral package'
    required: false
    default: ''
  app-group-id:
    description: 'Maven groupId of the application''s own JARs; they go to the app archive, every other file except bin/ and images/ to the deps archive. Empty puts every JAR into deps.'
    required: false
    default: ''

outputs:
  manifest-path:
    description: 'Path to the generated manifest'
    value: ${{ steps.outputs.outputs.manifest-path }}
  zip-path:
    description: 'Path to the archive with every file'
    value: ${{ steps.outputs.outputs.zip-path }}
  app-zip-path:
    description: 'Path to the app archive (platform-neutral); empty when the package has no app half'
    value: ${{ steps.outputs.outputs.app-zip-path }}
  deps-zip-path:
    description: 'Path to the deps archive; empty when the package has no deps half'
    value: ${{ steps.outputs.outputs.deps-zip-path }}

runs:
  using: 'composite'
  steps:

    # -------------------------------------------------------------------------
    # 1. Name the assets and prepare the work tree
    # -------------------------------------------------------------------------
    # Everything later steps build on: the four asset names, the output dir as
    # an absolute path (steps below cd around), and an empty staging tree.
    # The work tree is per platform, so several runs of this action - one per
    # platform - can share one output dir without overwriting each other's
    # staging. The release version is the tag the workflow runs for.
    - name: Name the assets and prepare the work tree
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        # Joins the non-empty parts with "-" - the rule ReleaseAssetNames applies.
        asset_name() {
          local name="" part
          for part in "$@"; do
            [ -n "$part" ] || continue
            name="${name:+$name-}$part"
          done
          echo "$name"
        }

        mkdir -p "$OUTPUT_DIR"
        output_dir=$(cd "$OUTPUT_DIR" && pwd)
        work_dir="$output_dir/.work-${PLATFORM:-neutral}"

        # A leftover tree from an earlier run would leak its files into this
        # package, so it goes first.
        rm -rf "$work_dir"
        mkdir -p "$work_dir/staging/lib" "$work_dir/staging/bin"

        {
          echo "TINYUPDATE_VERSION=${GITHUB_REF_NAME:-unknown}"
          echo "TINYUPDATE_OUTPUT_DIR=$output_dir"
          echo "TINYUPDATE_WORK_DIR=$work_dir"
          echo "TINYUPDATE_STAGING_DIR=$work_dir/staging"
          echo "TINYUPDATE_MANIFEST_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "update.json")"
          echo "TINYUPDATE_ZIP_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "files.zip")"
          echo "TINYUPDATE_APP_ZIP_NAME=$(asset_name "$ASSET_PREFIX" "app.zip")"
          echo "TINYUPDATE_DEPS_ZIP_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "deps.zip")"
        } >> "$GITHUB_ENV"

        echo "=== TinyUpdate Packager ==="
        echo "Version:  ${GITHUB_REF_NAME:-unknown}"
        echo "Platform: ${PLATFORM:-<neutral>}"
        echo "Output:   $output_dir"

    # -------------------------------------------------------------------------
    # 2. Collect the JARs into lib/
    # -------------------------------------------------------------------------
    # Every JAR of every artifact dir, except sources and javadoc JARs, which
    # a running application never loads. A JAR present in several dirs lands
    # once - deduplicated by its full file name, classifier included: cutting
    # the classifier would merge foo-1.0-mac-aarch64.jar with foo-1.0.jar,
    # which are different files. A missing dir is a warning, not a failure,
    # so optional artifact dirs need no special casing by the caller.
    - name: Collect the JARs into lib/
      shell: bash
      env:
        ARTIFACT_DIRS: ${{ inputs.artifact-dirs }}
      run: |
        set -euo pipefail

        declare -A jars  # file name -> path; the last dir listed wins

        IFS=',' read -ra dirs <<< "$ARTIFACT_DIRS"
        for dir in "${dirs[@]}"; do
          dir=$(echo "$dir" | xargs)  # trim the blanks around the comma
          if [ ! -d "$dir" ]; then
            echo "Warning: directory $dir not found, skipping"
            continue
          fi

          for jar in "$dir"/*.jar; do
            [ -f "$jar" ] || continue
            name=$(basename "$jar")
            case "$name" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            if [ -n "${jars[$name]+x}" ]; then
              echo "  Dedup: $name from $dir replaces the one from $(dirname "${jars[$name]}")"
            fi
            jars["$name"]="$jar"
          done
        done

        for jar in "${jars[@]}"; do
          cp "$jar" "$TINYUPDATE_STAGING_DIR/lib/"
        done
        echo "Collected ${#jars[@]} JARs"

    # -------------------------------------------------------------------------
    # 3. Collect the scripts into bin/
    # -------------------------------------------------------------------------
    # The scripts the installed application is set up and started with. The
    # patterns are globbed inside script-dir, so the caller picks e.g.
    # "setup.* uninstall.*" without listing every platform's variant. Copied
    # byte for byte: line endings stay what the checkout made them (CRLF for
    # .bat/.ps1 via .gitattributes).
    - name: Collect the scripts into bin/
      shell: bash
      env:
        SCRIPT_DIR: ${{ inputs.script-dir }}
        SCRIPT_PATTERNS: ${{ inputs.scripts }}
      run: |
        set -euo pipefail

        if [ ! -d "$SCRIPT_DIR" ]; then
          echo "No script dir $SCRIPT_DIR - bin/ stays empty"
          exit 0
        fi

        # $pattern unquoted on purpose: it is the glob.
        for pattern in $SCRIPT_PATTERNS; do
          for script in "$SCRIPT_DIR"/$pattern; do
            [ -f "$script" ] || continue
            cp "$script" "$TINYUPDATE_STAGING_DIR/bin/"
            echo "Bundled script: $(basename "$script")"
          done
        done

    # -------------------------------------------------------------------------
    # 4. Collect the images into images/
    # -------------------------------------------------------------------------
    # Images a launcher shows before the application exists on disk (icons,
    # logos). Only PNGs, flat. Skipped when the caller names no images dir.
    - name: Collect the images into images/
      if: inputs.images-dir != ''
      shell: bash
      env:
        IMAGES_DIR: ${{ inputs.images-dir }}
      run: |
        set -euo pipefail

        if [ ! -d "$IMAGES_DIR" ]; then
          echo "Warning: images dir $IMAGES_DIR not found, skipping"
          exit 0
        fi

        mkdir -p "$TINYUPDATE_STAGING_DIR/images"
        for image in "$IMAGES_DIR"/*.png; do
          [ -f "$image" ] || continue
          cp "$image" "$TINYUPDATE_STAGING_DIR/images/"
          echo "Bundled image: $(basename "$image")"
        done

    # -------------------------------------------------------------------------
    # 5. Copy the extra tree into the package root
    # -------------------------------------------------------------------------
    # Anything the steps above do not cover - native libraries, binaries - in
    # the exact place the caller put it relative to the package root. Copied
    # last, so an extra file deliberately replaces a collected one.
    - name: Copy the extra tree into the package root
      if: inputs.extra-dir != ''
      shell: bash
      env:
        EXTRA_DIR: ${{ inputs.extra-dir }}
      run: |
        set -euo pipefail

        if [ ! -d "$EXTRA_DIR" ]; then
          echo "Warning: extra dir $EXTRA_DIR not found, skipping"
          exit 0
        fi

        cp -R "$EXTRA_DIR"/. "$TINYUPDATE_STAGING_DIR"/
        echo "Bundled extra tree from $EXTRA_DIR:"
        (cd "$EXTRA_DIR" && find . -type f | sort)

    # -------------------------------------------------------------------------
    # 6. Write the manifest
    # -------------------------------------------------------------------------
    # One entry per staged file: its path relative to the install dir, its
    # SHA-256 and its size. The client diffs these hashes against the files
    # on disk - that diff, not the version, decides what an update does - and
    # verifies every file against them after extracting. Sorted, so the same
    # package always yields the same manifest.
    #
    # Written by hand rather than with a JSON tool: the shape is fixed and
    # its values (paths, hex hashes, numbers, the tag) carry no characters
    # that would need escaping - which is also what the client's reader
    # (ManifestJson) relies on.
    - name: Write the manifest
      shell: bash
      run: |
        set -euo pipefail

        manifest="$TINYUPDATE_OUTPUT_DIR/$TINYUPDATE_MANIFEST_NAME"
        {
          echo '{'
          echo "  \"version\": \"$TINYUPDATE_VERSION\","
          echo '  "files": ['

          first=true
          while read -r file; do
            path="${file#$TINYUPDATE_STAGING_DIR/}"
            sha256=$(shasum -a 256 "$file" | cut -d' ' -f1)
            # BSD stat first (macOS), GNU stat second (the runners).
            size=$(stat -f%z "$file" 2>/dev/null || stat --printf="%s" "$file")

            if [ "$first" = true ]; then
              first=false
            else
              echo ','
            fi
            printf '    { "path": "%s", "sha256": "%s", "size": %s }' "$path" "$sha256" "$size"
          done < <(find "$TINYUPDATE_STAGING_DIR" -type f | sort)

          echo ''
          echo '  ]'
          echo '}'
        } > "$manifest"

        echo "$TINYUPDATE_MANIFEST_NAME: $(grep -c '"path"' "$manifest") entries"

    # -------------------------------------------------------------------------
    # 7. Build the full archive
    # -------------------------------------------------------------------------
    # Every file of the manifest in one zip - what the client falls back to
    # whenever the release lacks one half of the split. Hidden files stay
    # out: they are never part of the manifest either.
    - name: Build the full archive
      shell: bash
      run: |
        set -euo pipefail

        zip_path="$TINYUPDATE_OUTPUT_DIR/$TINYUPDATE_ZIP_NAME"
        rm -f "$zip_path"
        (cd "$TINYUPDATE_STAGING_DIR" && zip -qr "$zip_path" . -x '.*')
        echo "$TINYUPDATE_ZIP_NAME: $(du -h "$zip_path" | cut -f1)"

    # -------------------------------------------------------------------------
    # 8. Split into the app and the deps archive
    # -------------------------------------------------------------------------
    # The app half is what changes on practically every release: bin/,
    # images/ and the application's own JARs. Those identify themselves by
    # the Maven descriptor maven-jar-plugin writes into every jar it builds
    # (META-INF/maven/<groupId>/...), so no module list has to be kept. The
    # trailing slash keeps sub-groups (e.g. de.bsommerfeld.jshepherd, an
    # external library) classified as dependencies.
    #
    # Everything else - third-party JARs, native libraries, any file outside
    # bin/ and images/ - is the deps half, so between them the two halves hold
    # every file of the manifest; a file in neither would fail the client's
    # verification.
    #
    # An empty half gets no archive (zip refuses to write one). The client
    # then finds the split incomplete and takes the full archive instead.
    - name: Split into the app and the deps archive
      shell: bash
      env:
        APP_GROUP_ID: ${{ inputs.app-group-id }}
      run: |
        set -euo pipefail

        app_dir="$TINYUPDATE_WORK_DIR/app"
        deps_dir="$TINYUPDATE_WORK_DIR/deps"
        mkdir -p "$app_dir" "$deps_dir"

        # Whether a staged JAR was built from the application's own group.
        # grep without -q: it has to read the listing to the end. With -q it
        # exits on the first hit, unzip dies of SIGPIPE on a long listing,
        # and under pipefail the jar would count as foreign - depending on
        # timing.
        is_app_jar() {
          [ -n "$APP_GROUP_ID" ] \
            && unzip -Z1 "$1" 2>/dev/null | grep -F "META-INF/maven/$APP_GROUP_ID/" >/dev/null
        }

        cd "$TINYUPDATE_STAGING_DIR"
        while read -r path; do
          half="$deps_dir"
          case "$path" in
            bin/*|images/*) half="$app_dir" ;;
            lib/*.jar)      is_app_jar "$path" && half="$app_dir" ;;
          esac
          mkdir -p "$half/$(dirname "$path")"
          cp "$path" "$half/$path"
        done < <(find . -type f ! -name '.*' | sed 's|^\./||' | sort)

        for half in app deps; do
          if [ "$half" = app ]; then name="$TINYUPDATE_APP_ZIP_NAME"; else name="$TINYUPDATE_DEPS_ZIP_NAME"; fi
          zip_path="$TINYUPDATE_OUTPUT_DIR/$name"
          rm -f "$zip_path"
          if [ -z "$(find "$TINYUPDATE_WORK_DIR/$half" -type f)" ]; then
            echo "$name: no files - not written"
            continue
          fi
          (cd "$TINYUPDATE_WORK_DIR/$half" && zip -qr "$zip_path" . -x '.*')
          echo "$name: $(find "$TINYUPDATE_WORK_DIR/$half" -type f | wc -l | xargs) files, $(du -h "$zip_path" | cut -f1)"
        done

    # -------------------------------------------------------------------------
    # 9. Hand out the paths and clean up
    # -------------------------------------------------------------------------
    # The action's outputs are the absolute paths of what was written; an
    # archive that step 8 did not write gets an empty path, so the caller can
    # tell. The work tree goes - the output dir keeps only the assets.
    - name: Hand out the paths and clean up
      id: outputs
      shell: bash
      run: |
        set -euo pipefail

        # The path of an asset in the output dir, or empty when it was not written.
        asset_path() {
          local path="$TINYUPDATE_OUTPUT_DIR/$1"
          [ -f "$path" ] && echo "$path" || echo ""
        }

        {
          echo "manifest-path=$(asset_path "$TINYUPDATE_MANIFEST_NAME")"
          echo "zip-path=$(asset_path "$TINYUPDATE_ZIP_NAME")"
          echo "app-zip-path=$(asset_path "$TINYUPDATE_APP_ZIP_NAME")"
          echo "deps-zip-path=$(asset_path "$TINYUPDATE_DEPS_ZIP_NAME")"
        } >> "$GITHUB_OUTPUT"

        rm -rf "$TINYUPDATE_WORK_DIR"
        echo "=== Packaging Complete ==="
