<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>WSBG Terminal · debug dashboard preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/titlebar.css">
</head>
<body>
<!-- Local design preview for the debug dashboard, in the spirit of
     web/_preview*.html: it renders the real dashboard modules against the
     fixture generator (js/debug/fixtures.js) so the view can be checked in a
     plain browser without starting the JCEF app.

       python3 -m http.server 8123 --directory terminal/src/main/resources/web
       open http://127.0.0.1:8123/debug-preview.html

     Query flags: ?runner=gguf switches the model fixture to the truncating
     GGUF runner, ?theme=light previews the light palette.
     The file matches the excluded pattern web/debug*.html and is never
     packaged - see terminal/pom.xml. -->

<div class="app">
  <header class="titlebar" id="titlebar">
    <div class="tb-controls"><div class="lights">
      <button class="light r"></button><button class="light y"></button><button class="light g"></button>
    </div></div>
    <div class="tb-title"><span>WSB<span class="flag">G</span></span><span class="sep">·</span><span>Terminal</span></div>
    <div class="tb-actions">
      <!-- the real grid button: the debug button is injected right before it -->
      <button class="iconbtn grid-btn js-grid-toggle" title="Widget-Übersicht">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
      </button>
      <button class="iconbtn gear-btn" title="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main class="main" style="padding:24px;color:var(--mute);font:13px Inter,sans-serif">
    Preview shell - the terminal itself is not rendered here. The debug button sits
    left of the grid icon in the titlebar; the dashboard opens over everything.
  </main>
</div>

<script type="module">
  import { fakeSocket } from '/js/debug/fixtures.js';
  import { initDebug } from '/js/debug/dashboard.js';

  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.dataset.theme = 'light';

  // Every outgoing request is counted, so the "closed = silent" rule can be
  // checked from the outside instead of believed (window.__dbgSends).
  const socket = fakeSocket({ runner: params.get('runner') || 'mlx' });
  window.__dbgSends = 0;
  const rawSend = socket.send.bind(socket);
  socket.send = (type, payload) => { if (type === 'debug') window.__dbgSends++; return rawSend(type, payload); };

  // ?bridge=none mimics a shipped build: the probe goes out, nothing answers,
  // so the module is never wired and no button appears. Same shape as main.js.
  if (params.get('bridge') === 'none') {
    socket.send = () => true;                 // swallowed, never answered
    socket.send('debug', { command: 'overview', requestId: 'probe' });
  } else {
    initDebug(socket);
  }
  // Open straight away - this page exists to look at the dashboard.
  if (params.get('open') !== 'false') {
    setTimeout(() => document.querySelector('.js-debug-toggle').click(), 60);
    const panel = params.get('panel');
    if (panel) setTimeout(() => {
      for (const tab of document.querySelectorAll('.dbg-tab')) {
        if (tab.textContent.toLowerCase().startsWith(panel.toLowerCase())) tab.click();
      }
    }, 400);
  }
</script>
</body>
</html>
