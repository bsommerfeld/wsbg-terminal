name: 'TinyUpdate Package'
description: 'Packages application artifacts with a SHA-256 manifest for TinyUpdate, optionally per platform'

# Asset naming - MUST match ReleaseAssetNames in the Java client: the non-empty
# parts of asset-prefix, platform and the base name joined by "-". The app
# archive never carries the platform (its files are the same everywhere), so
# every platform run of one release writes an identical <prefix>-app.zip.
#
#   asset-prefix  platform          manifest                          archives
#   ""            ""                update.json                       files.zip, app.zip, deps.zip
#   wsbg          windows-x86_64    wsbg-windows-x86_64-update.json   wsbg-windows-x86_64-files.zip,
#                                                                     wsbg-app.zip, wsbg-windows-x86_64-deps.zip

inputs:
  artifact-dirs:
    description: 'Comma-separated list of directories containing JARs to package into lib/ (e.g. "app/target,app/target/deps")'
    required: true
  script-dir:
    description: 'Directory containing scripts to bundle into bin/'
    required: false
    default: '.script'
  scripts:
    description: 'Space-separated glob patterns (relative to script-dir) of the scripts to bundle'
    required: false
    default: 'setup.*'
  output-dir:
    description: 'Output directory for the manifest and the archives'
    required: false
    default: 'updater-dist'
  images-dir:
    description: 'Optional directory whose PNG images are bundled into images/'
    required: false
    default: ''
  extra-dir:
    description: 'Optional directory whose whole tree is copied verbatim into the package root (e.g. native libraries under lib/)'
    required: false
    default: ''
  asset-prefix:
    description: 'Prefix that sets this application''s assets apart from others in the same release'
    required: false
    default: ''
  platform:
    description: 'Platform this package serves (Platform.current() in the client, e.g. "macos-aarch64"); empty for a platform-neutral package'
    required: false
    default: ''
  app-group-id:
    description: 'Maven groupId of the application''s own JARs; they go to the app archive, every other file except bin/ and images/ to the deps archive. Empty puts every JAR into deps.'
    required: false
    default: ''

outputs:
  manifest-path:
    description: 'Path to the generated manifest'
    value: ${{ steps.package.outputs.manifest-path }}
  zip-path:
    description: 'Path to the archive with every file'
    value: ${{ steps.package.outputs.zip-path }}
  app-zip-path:
    description: 'Path to the app archive (platform-neutral)'
    value: ${{ steps.package.outputs.app-zip-path }}
  deps-zip-path:
    description: 'Path to the deps archive'
    value: ${{ steps.package.outputs.deps-zip-path }}

runs:
  using: 'composite'
  steps:
    - name: Package for TinyUpdate
      id: package
      shell: bash
      env:
        ARTIFACT_DIRS: ${{ inputs.artifact-dirs }}
        SCRIPT_DIR: ${{ inputs.script-dir }}
        SCRIPT_PATTERNS: ${{ inputs.scripts }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        IMAGES_DIR: ${{ inputs.images-dir }}
        EXTRA_DIR: ${{ inputs.extra-dir }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        PLATFORM: ${{ inputs.platform }}
        APP_GROUP_ID: ${{ inputs.app-group-id }}
      run: |
        set -euo pipefail

        TAG_NAME="${GITHUB_REF_NAME:-unknown}"

        # Joins the non-empty parts with "-" - the rule ReleaseAssetNames applies.
        asset_name() {
          local name="" part
          for part in "$@"; do
            [ -n "$part" ] || continue
            name="${name:+$name-}$part"
          done
          echo "$name"
        }
        MANIFEST_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "update.json")
        ZIP_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "files.zip")
        APP_ZIP_NAME=$(asset_name "$ASSET_PREFIX" "app.zip")
        DEPS_ZIP_NAME=$(asset_name "$ASSET_PREFIX" "$PLATFORM" "deps.zip")

        mkdir -p "$OUTPUT_DIR"
        OUTPUT_DIR=$(cd "$OUTPUT_DIR" && pwd)

        # One work tree per platform, so several runs can share one output dir.
        WORK_DIR="$OUTPUT_DIR/.work-${PLATFORM:-neutral}"
        STAGING_DIR="$WORK_DIR/staging"
        rm -rf "$WORK_DIR"
        mkdir -p "$STAGING_DIR/lib" "$STAGING_DIR/bin"

        echo "=== TinyUpdate Packager ==="
        echo "Tag: $TAG_NAME"
        echo "Platform: ${PLATFORM:-<neutral>}"
        echo "Artifact dirs: $ARTIFACT_DIRS"

        # --- 1. Collect JARs ---
        declare -A JAR_MAP  # basename -> full path

        IFS=',' read -ra DIRS <<< "$ARTIFACT_DIRS"
        for dir in "${DIRS[@]}"; do
          dir=$(echo "$dir" | xargs)  # trim whitespace
          if [ ! -d "$dir" ]; then
            echo "Warning: directory $dir not found, skipping"
            continue
          fi

          for jar in "$dir"/*.jar; do
            [ -f "$jar" ] || continue

            basename=$(basename "$jar")

            # Skip sources/javadoc JARs
            if [[ "$basename" == *-sources.jar ]] || [[ "$basename" == *-javadoc.jar ]]; then
              continue
            fi

            # Dedup by full filename - only identical JARs from different dirs
            # collapse. Stripping classifiers would merge e.g.
            # foo-1.0-mac-aarch64.jar with foo-1.0.jar.
            if [ -n "${JAR_MAP[$basename]+x}" ]; then
              existing="${JAR_MAP[$basename]}"
              echo "  Dedup: replacing $(basename "$existing") with $basename"
            fi
            JAR_MAP["$basename"]="$jar"
          done
        done

        echo "Collected ${#JAR_MAP[@]} unique JARs"

        for jar_path in "${JAR_MAP[@]}"; do
          cp "$jar_path" "$STAGING_DIR/lib/"
        done

        # --- 2. Collect scripts and images ---
        if [ -d "$SCRIPT_DIR" ]; then
          for pattern in $SCRIPT_PATTERNS; do
            for script in "$SCRIPT_DIR"/$pattern; do
              [ -f "$script" ] || continue
              cp "$script" "$STAGING_DIR/bin/"
              echo "Bundled script: $(basename "$script")"
            done
          done
        fi

        if [ -n "$IMAGES_DIR" ] && [ -d "$IMAGES_DIR" ]; then
          mkdir -p "$STAGING_DIR/images"
          for img in "$IMAGES_DIR"/*.png; do
            [ -f "$img" ] || continue
            cp "$img" "$STAGING_DIR/images/"
            echo "Bundled image: $(basename "$img")"
          done
        fi

        # --- 2b. Extra tree (native libraries, binaries), copied verbatim ---
        if [ -n "$EXTRA_DIR" ] && [ -d "$EXTRA_DIR" ]; then
          cp -R "$EXTRA_DIR"/. "$STAGING_DIR"/
          echo "Bundled extra tree from $EXTRA_DIR:"
          (cd "$EXTRA_DIR" && find . -type f | sort)
        fi

        # --- 3. Generate Manifest ---
        echo "Generating $MANIFEST_NAME..."

        MANIFEST="$OUTPUT_DIR/$MANIFEST_NAME"
        echo '{' > "$MANIFEST"
        echo "  \"version\": \"$TAG_NAME\"," >> "$MANIFEST"
        echo '  "files": [' >> "$MANIFEST"

        FIRST=true
        find "$STAGING_DIR" -type f | sort | while read -r file; do
          rel_path="${file#$STAGING_DIR/}"
          sha256=$(shasum -a 256 "$file" | cut -d' ' -f1)
          size=$(stat -f%z "$file" 2>/dev/null || stat --printf="%s" "$file" 2>/dev/null)

          if [ "$FIRST" = true ]; then
            FIRST=false
          else
            echo ',' >> "$MANIFEST"
          fi

          printf '    { "path": "%s", "sha256": "%s", "size": %s }' "$rel_path" "$sha256" "$size" >> "$MANIFEST"
        done

        echo '' >> "$MANIFEST"
        echo '  ]' >> "$MANIFEST"
        echo '}' >> "$MANIFEST"

        echo "Manifest generated with $(grep -c '"path"' "$MANIFEST") entries"

        # --- 4. Create Zips ---
        echo "Creating $ZIP_NAME..."
        rm -f "$OUTPUT_DIR/$ZIP_NAME" "$OUTPUT_DIR/$APP_ZIP_NAME" "$OUTPUT_DIR/$DEPS_ZIP_NAME"
        cd "$STAGING_DIR"
        zip -qr "$OUTPUT_DIR/$ZIP_NAME" . -x '.*'

        echo "Splitting $APP_ZIP_NAME and $DEPS_ZIP_NAME..."
        mkdir -p "$WORK_DIR/app/lib" "$WORK_DIR/deps"

        # The app half is what changes on practically every release: bin/,
        # images/ and the application's own JARs. Those identify themselves by
        # the Maven descriptor maven-jar-plugin writes into every jar it builds
        # (META-INF/maven/<groupId>/...), so no module list has to be kept. The
        # trailing slash keeps sub-groups (e.g. de.bsommerfeld.jshepherd, an
        # external library) classified as dependencies. Everything else - third
        # party JARs, native libraries, any file outside bin/ and images/ - is
        # the deps half, so the split never drops a file of the manifest.
        find . -type f ! -name '.*' | sed 's|^\./||' | sort | while read -r rel; do
          target="deps"
          case "$rel" in
            bin/*|images/*) target="app" ;;
            lib/*.jar)
              # grep without -q: it has to read the listing to the end. With -q
              # it exits on the first hit, unzip dies of SIGPIPE on a long
              # listing, and under pipefail the jar would count as foreign -
              # depending on timing.
              if [ -n "$APP_GROUP_ID" ] && unzip -Z1 "$rel" 2>/dev/null | grep -F "META-INF/maven/$APP_GROUP_ID/" >/dev/null; then
                target="app"
              fi
              ;;
          esac
          mkdir -p "$WORK_DIR/$target/$(dirname "$rel")"
          cp "$rel" "$WORK_DIR/$target/$rel"
        done

        # An empty half gets no archive (zip refuses to write one). The client
        # then finds the split incomplete and takes the full archive instead.
        if [ -n "$(find "$WORK_DIR/app" -type f)" ]; then
          (cd "$WORK_DIR/app" && zip -qr "$OUTPUT_DIR/$APP_ZIP_NAME" . -x '.*')
        fi
        if [ -n "$(find "$WORK_DIR/deps" -type f)" ]; then
          (cd "$WORK_DIR/deps" && zip -qr "$OUTPUT_DIR/$DEPS_ZIP_NAME" . -x '.*')
        fi

        cd "$OUTPUT_DIR"
        rm -rf "$WORK_DIR"
        ls -l "$MANIFEST_NAME" "$ZIP_NAME" "$APP_ZIP_NAME" "$DEPS_ZIP_NAME" 2>/dev/null || true

        echo "=== Packaging Complete ==="
        echo "manifest-path=$OUTPUT_DIR/$MANIFEST_NAME" >> "$GITHUB_OUTPUT"
        echo "zip-path=$OUTPUT_DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "app-zip-path=$OUTPUT_DIR/$APP_ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "deps-zip-path=$OUTPUT_DIR/$DEPS_ZIP_NAME" >> "$GITHUB_OUTPUT"
