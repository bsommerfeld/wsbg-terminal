[package]
name = "wsbg-shell"
version = "0.1.0"
edition = "2021"
description = "WSBG Terminal shell: a native window with the system webview around the terminal's web UI; the Java backend runs as a sidecar."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
